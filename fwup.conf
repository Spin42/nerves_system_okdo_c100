# Firmware configuration file for the OKdo Nano C100
#
# Tasks:
#
# * `complete` - Install on a microSD card (what `mix burn` runs)
# * `emmc` - Install on the eMMC exposed over USB by U-Boot's `ums 0 mmc 0`.
#   This also writes this system's U-Boot to the LNX partition. Run
#   scripts/check-emmc-layout.sh on the device first.
# * `upgrade` - Update the inactive slot (boot partition and root filesystem)
#   on either medium

require-fwup-version="1.4.0"

include("${NERVES_SDK_IMAGES:-.}/fwup_include/fwup-common.conf")

# File resources are listed in the order that they are included in the .fw file
# This is important, since this is the order that they're written on a firmware
# update due to the event driven nature of the update system.

# Chain-loading script and U-Boot for the microSD card's bootloader partition
file-resource boot.scr {
    host-path = "${NERVES_SYSTEM}/images/boot.scr"
}
file-resource u-boot.bin {
    host-path = "${NERVES_SYSTEM}/images/u-boot.bin"
}

# U-Boot wrapped for cboot (see scripts/mkbootimg-lnx.py). It is listed twice
# because it goes to both LNX and LNX-1.
file-resource boot.img {
    host-path = "${NERVES_SYSTEM}/images/boot.img"
    assert-size-lte = ${LNX_PART_COUNT}
}
file-resource boot-backup.img {
    host-path = "${NERVES_SYSTEM}/images/boot.img"
    assert-size-lte = ${LNX_PART_COUNT}
}
file-resource uboot-env.bin {
    host-path = "${NERVES_SYSTEM}/images/uboot-env.bin"
}

# Kernel and device tree for the slot's boot partition
file-resource Image {
    host-path = "${NERVES_SYSTEM}/images/Image"
}
file-resource tegra210-p3448-0002-okdo-c100.dtb {
    host-path = "${NERVES_SYSTEM}/images/tegra210-p3448-0002-okdo-c100.dtb"
}

file-resource rootfs.img {
    host-path = ${ROOTFS}

    # Error out if the rootfs size exceeds the partition size
    assert-size-lte = ${ROOTFS_A_PART_COUNT}
}

define(BASIC_DATA_TYPE, ebd0a0a2-b9e5-4433-87c0-68b6b72699c7)
define(LINUX_DATA_TYPE, 0fc63daf-8483-4772-8e79-3d69d8477de4)

# microSD card. Linux numbers the slot and application partitions as on the
# eMMC; the bootloader partition is p5 although it is first on the card. It is
# marked bootable so that distro boot in another U-Boot finds boot.scr. The
# application partition grows to fill the card, so it is the last entry.
gpt sd-gpt {
    guid = 942797bb-6e54-44e1-aea9-bbb95f0117d8

    partition 0 {
        block-offset = ${BOOT_A_PART_OFFSET}
        block-count = ${BOOT_A_PART_COUNT}
        type = ${BASIC_DATA_TYPE}
        guid = 9fc77ed8-7e67-4c8f-8e4e-ed9557ac5d47
        name = "boot-a"
    }
    partition 1 {
        block-offset = ${BOOT_B_PART_OFFSET}
        block-count = ${BOOT_B_PART_COUNT}
        type = ${BASIC_DATA_TYPE}
        guid = edc3ce6c-b1a7-48f2-8d80-50e9d410461d
        name = "boot-b"
    }
    partition 2 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_DATA_TYPE}
        guid = b39f073c-6bad-4869-88b1-b55b2d467928
        name = "rootfs-a"
    }
    partition 3 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_DATA_TYPE}
        guid = 27dda616-162c-4c66-8651-8c7edea10c08
        name = "rootfs-b"
    }
    partition 4 {
        block-offset = ${BOOTLOADER_PART_OFFSET}
        block-count = ${BOOTLOADER_PART_COUNT}
        type = ${BASIC_DATA_TYPE}
        guid = f476fed3-b001-4025-a8a9-e33c635ee257
        name = "bootloader"
        boot = true
    }
    partition 5 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = ${LINUX_DATA_TYPE}
        guid = a2c6f2cf-511e-4960-bd6a-81901b858568
        name = "app"
        expand = true
    }
}

# eMMC. NVIDIA's DTB (p5) and partitions p7 and up reproduce NVIDIA's L4T
# R32.7 eMMC layout for the
# P3448-0002 module (flash_l4t_t210_emmc_p3448.xml with ROOTFSSIZE=14GiB).
# fwup only ever writes LNX and LNX-1 (U-Boot) among them, and only in the
# emmc task. cboot starts U-Boot from LNX, so the eMMC needs no bootloader
# partition. A GPT written by fwup holds at most 16 entries, so L4T's BMP
# (boot splash), recovery, recovery-dtb, RECROOTFS and UDA partitions are not
# listed. Nerves does not use them; their contents stay in place.
gpt emmc-gpt {
    guid = 6ca3b027-1c38-4df7-8d79-2ef69e4bb9a0

    partition 0 {
        block-offset = ${BOOT_A_PART_OFFSET}
        block-count = ${BOOT_A_PART_COUNT}
        type = ${BASIC_DATA_TYPE}
        guid = 4ba59285-af39-4a4d-93bf-9868302742bf
        name = "boot-a"
    }
    partition 1 {
        block-offset = ${BOOT_B_PART_OFFSET}
        block-count = ${BOOT_B_PART_COUNT}
        type = ${BASIC_DATA_TYPE}
        guid = 8386e451-1870-4a22-872f-2f75efd11b92
        name = "boot-b"
    }
    partition 2 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_DATA_TYPE}
        guid = 507a9631-ff47-4e7f-8d37-a208193d2a5b
        name = "rootfs-a"
    }
    partition 3 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_DATA_TYPE}
        guid = c7721b30-9925-4142-9d48-998bd4dfd01d
        name = "rootfs-b"
    }
    partition 4 {
        block-offset = 29364224
        block-count = 2048
        type = ${BASIC_DATA_TYPE}
        guid = 9586e651-8621-4e35-86c3-605891fd466b
        name = "DTB"
    }
    partition 5 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${EMMC_APP_PART_COUNT}
        type = ${LINUX_DATA_TYPE}
        guid = b9744e57-5ccc-4e52-b955-c8daacf844cb
        name = "app"
    }
    partition 6 {
        block-offset = 29366272
        block-count = 12288
        type = ${BASIC_DATA_TYPE}
        guid = 39789bc9-c9ae-41de-ae88-c79cae98482c
        name = "TOS"
    }
    partition 7 {
        block-offset = 29378560
        block-count = 160
        type = ${BASIC_DATA_TYPE}
        guid = fc6b7e87-df8f-4748-820b-f4ef7fe9259b
        name = "EKS"
    }
    partition 8 {
        block-offset = ${LNX_PART_OFFSET}
        block-count = ${LNX_PART_COUNT}
        type = ${BASIC_DATA_TYPE}
        guid = 5f511cf0-a514-4a3f-b0d3-85bac6504272
        name = "LNX"
    }
    partition 9 {
        block-offset = 29509760
        block-count = 2048
        type = ${BASIC_DATA_TYPE}
        guid = 1169cb81-bd52-4ef2-9a54-c861bde22b63
        name = "DTB-1"
    }
    partition 10 {
        block-offset = 29511808
        block-count = 12288
        type = ${BASIC_DATA_TYPE}
        guid = d1426654-50b9-4e42-aa8c-2aa3e3fbed9b
        name = "TOS-1"
    }
    partition 11 {
        block-offset = 29524096
        block-count = 160
        type = ${BASIC_DATA_TYPE}
        guid = d15994db-3c7c-46a0-b27b-70dfa5136db4
        name = "EKS-1"
    }
    partition 12 {
        block-offset = ${LNX_B_PART_OFFSET}
        block-count = ${LNX_PART_COUNT}
        type = ${BASIC_DATA_TYPE}
        guid = 1eb415d0-0e9e-4ddb-bc29-8bf59405c555
        name = "LNX-1"
    }
    partition 13 {
        block-offset = 29655680
        block-count = 512
        type = ${BASIC_DATA_TYPE}
        guid = a1bcdd22-b6fa-4136-ba1e-c20a95583d5b
        name = "RP4"
    }
    partition 14 {
        block-offset = 29786240
        block-count = 512
        type = ${BASIC_DATA_TYPE}
        guid = ddddc6ab-00fe-4192-b76f-00635d379bf2
        name = "kernel-bootctrl"
    }
    partition 15 {
        block-offset = 29786752
        block-count = 512
        type = ${BASIC_DATA_TYPE}
        guid = b89c6be4-d187-4b4c-bd3c-8fc04b9b8312
        name = "kernel-bootctrl_b"
    }
}

# Location where installed firmware information is stored.
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

# Install on a microSD card. This should only be run to initialize a card!
task complete {
    # Only match if not mounted
    require-unmounted-destination = true

    on-init {
        gpt_write(sd-gpt)
        fat_mkfs(${BOOTLOADER_PART_OFFSET}, ${BOOTLOADER_PART_COUNT})
        fat_setlabel(${BOOTLOADER_PART_OFFSET}, "BOOTLOADER")
        fat_mkfs(${BOOT_A_PART_OFFSET}, ${BOOT_A_PART_COUNT})
        fat_setlabel(${BOOT_A_PART_OFFSET}, "BOOT-A")
    }

    on-resource boot.scr { fat_write(${BOOTLOADER_PART_OFFSET}, "boot.scr") }
    on-resource u-boot.bin { fat_write(${BOOTLOADER_PART_OFFSET}, "u-boot.bin") }

    on-resource uboot-env.bin {
        # Boot to the A partition first and don't fail back.
        raw_write(${UBOOT_ENV_OFFSET})

        # Include provisioning instructions
        include("${NERVES_PROVISIONING}")

        # U-Boot's mmc1 is the microSD card
        uboot_setenv(uboot-env, "devnum", "1")
        include("${NERVES_SDK_IMAGES:-.}/fwup_include/fwup-metadata-a.conf")
    }
    on-resource Image { fat_write(${BOOT_A_PART_OFFSET}, "Image") }
    on-resource tegra210-p3448-0002-okdo-c100.dtb {
        fat_write(${BOOT_A_PART_OFFSET}, "tegra210-p3448-0002-okdo-c100.dtb")
    }
    on-resource rootfs.img {
        # write to the first rootfs partition
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
        # Clear out any old data in the B partitions that might be mistaken for
        # a file system. This is mostly to avoid confusion in humans when
        # reprogramming cards with unknown contents.
        raw_memset(${BOOT_B_PART_OFFSET}, 256, 0xff)
        raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)

        # Invalidate the application data partition so that it is guaranteed to
        # trigger the corrupt filesystem detection code on first boot and get
        # formatted. If this isn't done and an old card is reused, the
        # application data could be in a weird state.
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}

# Install on the eMMC. This should only be run to initialize a board!
task emmc {
    # Only match if not mounted
    require-unmounted-destination = true

    on-init {
        gpt_write(emmc-gpt)
        fat_mkfs(${BOOT_A_PART_OFFSET}, ${BOOT_A_PART_COUNT})
        fat_setlabel(${BOOT_A_PART_OFFSET}, "BOOT-A")
    }

    on-resource boot.img { raw_write(${LNX_PART_OFFSET}) }
    on-resource boot-backup.img { raw_write(${LNX_B_PART_OFFSET}) }

    on-resource uboot-env.bin {
        # Boot to the A partition first and don't fail back.
        raw_write(${UBOOT_ENV_OFFSET})

        # Include provisioning instructions
        include("${NERVES_PROVISIONING}")

        # U-Boot's mmc0 is the eMMC
        uboot_setenv(uboot-env, "devnum", "0")
        include("${NERVES_SDK_IMAGES:-.}/fwup_include/fwup-metadata-a.conf")
    }
    on-resource Image { fat_write(${BOOT_A_PART_OFFSET}, "Image") }
    on-resource tegra210-p3448-0002-okdo-c100.dtb {
        fat_write(${BOOT_A_PART_OFFSET}, "tegra210-p3448-0002-okdo-c100.dtb")
    }
    on-resource rootfs.img {
        # write to the first rootfs partition
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
        raw_memset(${BOOT_B_PART_OFFSET}, 256, 0xff)
        raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}

task upgrade.a {
    # This task upgrades the A partition
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")

    # Require that the running version of firmware has been validated.
    # If it has not, then failing back is not guaranteed to work.
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")

    # Verify the expected platform/architecture
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading partition A")

        # Clear some firmware information just in case this update gets
        # interrupted midway. If this partition was bootable, it's not going to
        # be soon.
        uboot_unsetenv(uboot-env, "a.nerves_fw_version")
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "a.nerves_fw_uuid")

        # Indicate that the entire partition can be cleared
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})

        fat_mkfs(${BOOT_A_PART_OFFSET}, ${BOOT_A_PART_COUNT})
        fat_setlabel(${BOOT_A_PART_OFFSET}, "BOOT-A")
    }

    on-resource Image { fat_write(${BOOT_A_PART_OFFSET}, "Image") }
    on-resource tegra210-p3448-0002-okdo-c100.dtb {
        fat_write(${BOOT_A_PART_OFFSET}, "tegra210-p3448-0002-okdo-c100.dtb")
    }
    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_B_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_B_PART_COUNT}
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
        # Update firmware metadata
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")

        # Reset the validation status and boot to A
        # next time.
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_validated", "0")
        uboot_setenv(uboot-env, "nerves_fw_booted", "0")
    }

    on-error {
    }
}

task upgrade.b {
    # This task upgrades the B partition
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")

    # Verify the expected platform/architecture
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading partition B")

        # Clear some firmware information just in case this update gets
        # interrupted midway.
        uboot_unsetenv(uboot-env, "b.nerves_fw_version")
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "b.nerves_fw_uuid")

        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})

        fat_mkfs(${BOOT_B_PART_OFFSET}, ${BOOT_B_PART_COUNT})
        fat_setlabel(${BOOT_B_PART_OFFSET}, "BOOT-B")
    }

    on-resource Image { fat_write(${BOOT_B_PART_OFFSET}, "Image") }
    on-resource tegra210-p3448-0002-okdo-c100.dtb {
        fat_write(${BOOT_B_PART_OFFSET}, "tegra210-p3448-0002-okdo-c100.dtb")
    }
    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_A_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_A_PART_COUNT}
        raw_write(${ROOTFS_B_PART_OFFSET})
    }

    on-finish {
        # Update firmware metadata
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "b.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "b.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "b.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "b.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "b.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "b.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "b.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "b.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "b.nerves_fw_uuid", "\${FWUP_META_UUID}")

        # Reset the validation status and boot to B next time.
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        uboot_setenv(uboot-env, "nerves_fw_validated", "0")
        uboot_setenv(uboot-env, "nerves_fw_booted", "0")
    }

    on-error {
    }
}

task upgrade.unvalidated {
    require-uboot-variable(uboot-env, "nerves_fw_validated", "0")

    on-init {
        error("Please validate the running firmware before upgrading it again.")
    }
}

task upgrade.unexpected {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        error("Please check the media being upgraded. It doesn't look like either the A or B partitions are active.")
    }
}

task upgrade.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}

task provision {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        include("${NERVES_PROVISIONING}")
    }
}
task provision.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}
