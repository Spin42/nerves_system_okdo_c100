#
# Firmware metadata
#

# All of these can be overriden using environment variables of the same name.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "okdo_c100")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "The Nerves Team")

# /dev/rootdisk* paths are provided by erlinit to refer to the disk and
# partitions that Nerves booted from: the microSD card or the eMMC.
define(NERVES_FW_DEVPATH, "/dev/rootdisk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/rootdisk0p4") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Nerves uses the same layout on the microSD card and on the eMMC, so updates
# work the same on both:
#
# +------------------------------------+ 0
# | Protective MBR + GPT               |
# +------------------------------------+ 2 MiB
# | U-Boot environment                 |
# +------------------------------------+
# | p1: boot (FAT)                     |  boot.scr and u-boot.bin, used when
# |                                    |  another U-Boot boots the microSD card
# +------------------------------------+ 4 MiB
# | p2: Rootfs A (squashfs, 1 GiB)     |  /boot holds the kernel and dtb
# +------------------------------------+
# | p3: Rootfs B (squashfs, 1 GiB)     |
# +------------------------------------+
# | p4: Application (f2fs)             |  fills the microSD card; ends at
# |                                    |  2 MiB + 14 GiB on the eMMC
# +------------------------------------+
# | eMMC only: NVIDIA partitions       |  see fwup.conf
# +------------------------------------+

# The U-Boot environment is written directly to the storage. It is not in any
# partition.
define(UBOOT_ENV_OFFSET, 4096)
define(UBOOT_ENV_COUNT, 256)  # 128 KiB

define-eval(BOOT_PART_OFFSET, "${UBOOT_ENV_OFFSET} + ${UBOOT_ENV_COUNT}")
define-eval(BOOT_PART_COUNT, "8192 - ${BOOT_PART_OFFSET}")

define(ROOTFS_A_PART_OFFSET, 8192)
define(ROOTFS_A_PART_COUNT, 2097152)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application partition. APP_PART_COUNT is its minimum size; it grows to fill
# a microSD card. On the eMMC it ends where NVIDIA's APP partition ended.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)  # 512 MiB
define-eval(EMMC_APP_PART_COUNT, "29364224 - ${APP_PART_OFFSET}")

# cboot loads U-Boot from LNX, and from LNX-1 if LNX is unusable
define(LNX_PART_OFFSET, 29378720)
define(LNX_B_PART_OFFSET, 29524256)
define(LNX_PART_COUNT, 131040)

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
