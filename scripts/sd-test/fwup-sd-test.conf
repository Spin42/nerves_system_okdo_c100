# microSD test image for the OKdo Nano C100
#
# Built by scripts/make-sd-test-fw.sh from a regular firmware file. Booted by
# the U-Boot already on the board's eMMC through boot.scr, so the eMMC is left
# alone. There is a single root filesystem and no A/B updates.
#
# +----------------------------+ 0
# | MBR                        |
# +----------------------------+ 2 MiB
# | U-Boot environment         |  read by Nerves only
# +----------------------------+ 4 MiB
# | p1: boot (FAT32)           |  boot.scr, Image, dtb
# +----------------------------+
# | p2: rootfs (squashfs)      |
# +----------------------------+
# | p3: application (f2fs)     |
# +----------------------------+

require-fwup-version="1.4.0"

define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "microSD test image")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
# Differs from the eMMC platform so that regular updates refuse to run on a
# card with this layout.
define(NERVES_FW_PLATFORM, "okdo_c100_sd_test")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "The Nerves Team")

define(NERVES_FW_DEVPATH, "/dev/mmcblk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mmcblk0p3")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")

define(UBOOT_ENV_OFFSET, 4096)
define(UBOOT_ENV_COUNT, 256)  # 128 KiB

define(BOOT_PART_OFFSET, 8192)
define(BOOT_PART_COUNT, 131072)  # 64 MiB
define-eval(ROOTFS_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}")
define(ROOTFS_PART_COUNT, 2097152)  # 1 GiB
define-eval(APP_PART_OFFSET, "${ROOTFS_PART_OFFSET} + ${ROOTFS_PART_COUNT}")
define(APP_PART_COUNT, 1048576)  # 512 MiB minimum, grows to fill the card

meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}

file-resource boot.scr { host-path = "${BOOT_SCR}" }
file-resource Image { host-path = "${NERVES_SYSTEM}/images/Image" }
file-resource tegra210-p3448-0002-okdo-c100.dtb { host-path = "${NERVES_SYSTEM}/images/tegra210-p3448-0002-okdo-c100.dtb" }
file-resource uboot-env.bin { host-path = "${NERVES_SYSTEM}/images/uboot-env.bin" }
file-resource rootfs.img {
    host-path = ${ROOTFS}
    assert-size-lte = ${ROOTFS_PART_COUNT}
}

mbr mbr {
    partition 0 {
        block-offset = ${BOOT_PART_OFFSET}
        block-count = ${BOOT_PART_COUNT}
        type = 0xc # FAT32
        boot = true
    }
    partition 1 {
        block-offset = ${ROOTFS_PART_OFFSET}
        block-count = ${ROOTFS_PART_COUNT}
        type = 0x83 # Linux
    }
    partition 2 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = 0x83 # Linux
        expand = true
    }
}

uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

task complete {
    require-unmounted-destination = true

    on-init {
        mbr_write(mbr)
        fat_mkfs(${BOOT_PART_OFFSET}, ${BOOT_PART_COUNT})
        fat_setlabel(${BOOT_PART_OFFSET}, "BOOT")
    }

    on-resource boot.scr { fat_write(${BOOT_PART_OFFSET}, "boot.scr") }
    on-resource Image { fat_write(${BOOT_PART_OFFSET}, "Image") }
    on-resource tegra210-p3448-0002-okdo-c100.dtb { fat_write(${BOOT_PART_OFFSET}, "tegra210-p3448-0002-okdo-c100.dtb") }

    on-resource uboot-env.bin {
        raw_write(${UBOOT_ENV_OFFSET})
        uboot_setenv(uboot-env, "nerves_serial_number", "\${NERVES_SERIAL_NUMBER}")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_devpath", ${NERVES_FW_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }

    on-resource rootfs.img { raw_write(${ROOTFS_PART_OFFSET}) }

    on-finish {
        # Force the application partition to be formatted on first boot
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}
